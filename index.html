<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DAD6CC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1F21" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baseline">
<meta name="description" content="Weekly-floor fitness tracker: sessions, daily sets, weight and waist.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://api.github.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">

<title>Baseline</title>
<style>
@font-face{
  font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;
  src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2-variations"),url(fonts/archivo-latin-wdth-normal.woff2) format("woff2");
}
:root{
  --bg:#DAD6CC; --surface:#E9E6DE; --raised:#F3F1EB; --track:#C7C3B7;
  --ink:#22262A; --ink-2:#55564F; --ink-3:#7C786C; --line:rgba(34,38,42,.16);
  --olive:#5B6C10; --blue:#3E80B4; --warn:#9A4B3C; --on-fill:#F3F1EB;
  --band:rgba(34,38,42,.07);
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1F21; --surface:#262A2D; --raised:#30353A; --track:#3A4045;
    --ink:#E7E3D9; --ink-2:#B5B1A6; --ink-3:#8E8A7F; --line:rgba(231,227,217,.16);
    --olive:#8B9E44; --blue:#5192C8; --warn:#D98A78; --on-fill:#16191B;
    --band:rgba(231,227,217,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1F21; --surface:#262A2D; --raised:#30353A; --track:#3A4045;
  --ink:#E7E3D9; --ink-2:#B5B1A6; --ink-3:#8E8A7F; --line:rgba(231,227,217,.16);
  --olive:#8B9E44; --blue:#5192C8; --warn:#D98A78; --on-fill:#16191B;
  --band:rgba(231,227,217,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  font-weight:420;font-stretch:100%;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-align:inherit}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.cond{font-stretch:66%;font-variation-settings:"wdth" 66}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 92px)}

/* top line: where you are + save state */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-height:24px}
.kicker{font-size:14px;font-weight:560;color:var(--ink-2)}
.sync{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 0 6px 8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.ok i{background:var(--olive)} .sync.busy i{background:var(--blue)} .sync.bad i{background:var(--warn)}

/* verdict */
.verdict{font-size:46px;line-height:.96;font-weight:760;letter-spacing:-.012em;margin:10px 0 0;
  font-stretch:66%;font-variation-settings:"wdth" 66}
.verdict-sub{font-size:15px;color:var(--ink-2);margin:8px 0 0;max-width:34ch}
h1.page{font-size:40px;line-height:1;font-weight:760;margin:10px 0 0;font-stretch:66%;font-variation-settings:"wdth" 66}
h2{font-size:15px;font-weight:650;margin:30px 0 10px}
h2 small{font-weight:440;color:var(--ink-3);font-size:13px;margin-left:6px}
p{margin:0}
.note{font-size:13px;color:var(--ink-2);margin-top:8px}
.muted{color:var(--ink-3)}

/* floor chart: blocks stack up; the floor line is the same height in every column */
.floor{margin-top:22px}
.floor-plot{position:relative;height:150px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;margin-right:42px}
.stack{display:flex;flex-direction:column-reverse;gap:4px}
.blk{flex:1;border-radius:3px;background:var(--track);min-height:0}
.blk.f{background:var(--olive)} .blk.b{background:var(--blue)}
.floor-line{position:absolute;left:-6px;right:-42px;bottom:calc(50% - 1px);height:2px;background:var(--ink);pointer-events:none}
.floor-line span{position:absolute;right:0;bottom:5px;font-size:12px;font-weight:600;color:var(--ink)}
.floor-labels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:10px 42px 0 0}
.floor-labels div{font-size:13px;color:var(--ink-2);line-height:1.25}
.floor-labels b{display:block;font-size:15px;font-weight:650;color:var(--ink)}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:26px}
.strip button{height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface)}
.strip .dl{font-size:11px;color:var(--ink-3);font-weight:560}
.strip .dn{font-size:17px;font-weight:650;line-height:1.1}
.strip .dm{display:flex;gap:3px;height:5px}
.strip .dm i{width:5px;height:5px;border-radius:1px;background:var(--olive)}
.strip .dm i.b{background:var(--blue)}
.strip button.today .dn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.strip button.sel{background:var(--ink)}
.strip button.sel .dl,.strip button.sel .dn{color:var(--bg)}
.strip button.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 0}
.dayhead h2{margin:0;font-size:19px;font-weight:700}
.dayhead button{font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:8px 0 8px 12px}

/* tap rows */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 14px;border-radius:14px;background:var(--surface)}
.row-main{flex:1;min-width:0}
.row-t{display:block;font-size:16px;font-weight:600}
.row-s{display:block;font-size:13px;color:var(--ink-2);margin-top:1px}
.tick{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3);flex:none;display:grid;place-items:center}
.tick svg{width:15px;height:15px;opacity:0}
.row.on{background:var(--olive);color:var(--on-fill)}
.row.on .row-s{color:var(--on-fill);opacity:.82}
.row.on .tick{box-shadow:none;background:var(--on-fill);color:var(--olive)}
.row.on .tick svg{opacity:1}
.row:active{transform:scale(.985)}

/* counters */
.counter{background:var(--surface);border-radius:14px;padding:12px 14px 14px}
.counter + .counter{margin-top:6px}
.counter-head{display:flex;justify-content:space-between;align-items:baseline}
.counter-head .name{font-size:16px;font-weight:600}
.counter-head .val{font-size:15px;color:var(--ink-2)}
.counter-head .val b{font-size:34px;line-height:1;font-weight:760;color:var(--ink);font-stretch:66%;font-variation-settings:"wdth" 66;margin-right:4px}
.tally{display:block;height:26px;margin:8px 0 12px;max-width:100%}
.tally .t{stroke:var(--track)} .tally .d{stroke:var(--olive)} .tally .o{stroke:var(--blue)}
.tally path{fill:none;stroke-width:2.4;stroke-linecap:round}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{height:48px;border-radius:12px;background:var(--raised);font-size:17px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
.steps button.minus{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.steps button:active{background:var(--ink);color:var(--bg)}

.banner{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:14px;border-left:3px solid var(--blue)}
.banner.warn{border-left-color:var(--warn)}
.banner button{text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* forms */
.panel{background:var(--surface);border-radius:14px;padding:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;color:var(--ink-2);font-weight:560}
label.f input{display:block;width:100%;margin-top:5px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--raised);
  padding:0 12px;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);-webkit-appearance:none;appearance:none}
label.f input::placeholder{color:var(--ink-3);font-weight:440}
label.f.wide{grid-column:1/-1}
.btn{display:block;width:100%;height:50px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:650;text-align:center;margin-top:12px}
.btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.5}
.msg{font-size:13px;color:var(--warn);margin-top:8px;min-height:1em}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:0}
.kv:last-child{padding-bottom:0}
.kv span:first-child{color:var(--ink-2)}
.kv span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* week matrix */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
.weeknav button{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.weeknav button:disabled{opacity:.3}
.weeknav div{text-align:center;font-weight:650}
.weeknav div small{display:block;font-weight:440;font-size:13px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.matrix th,.matrix td{text-align:center;font-size:13px;height:34px;padding:0;font-weight:440}
.matrix th:first-child,.matrix td:first-child{text-align:left;color:var(--ink-2);width:27%}
.matrix thead button{display:block;width:100%;padding:4px 0;border-radius:8px;font-size:11px;color:var(--ink-3);line-height:1.25;text-align:center}
.matrix thead button b{display:block;font-size:14px;color:var(--ink);font-weight:650}
.matrix thead button.today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.matrix tbody tr{border-top:1px solid var(--line)}
.matrix td b{font-weight:700}
.matrix td.dim{color:var(--ink-3)}
.sq{display:inline-block;width:11px;height:11px;border-radius:2px;background:var(--olive);vertical-align:-1px}
.sq.e{background:var(--track)}
.weeks button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-top:1px solid var(--line)}
.weeks button:first-child{border-top:0}
.weeks .wk{flex:1;min-width:0}
.weeks .wk b{display:block;font-weight:600;font-size:15px}
.weeks .wk span{font-size:13px;color:var(--ink-2)}
.weeks .res{font-size:13px;font-weight:600;text-align:right}
.glyph{display:flex;gap:3px;align-items:flex-end;height:20px}
.glyph i{width:7px;border-radius:1.5px;background:var(--track);height:9px}
.glyph i.f{background:var(--olive);height:14px} .glyph i.p{background:var(--blue);height:20px}

/* charts */
.figs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.fig span{display:block;font-size:13px;color:var(--ink-2)}
.fig b{font-size:30px;line-height:1.05;font-weight:740;font-stretch:66%;font-variation-settings:"wdth" 66}
.fig b small{font-size:15px;font-weight:560;color:var(--ink-2);margin-left:3px;font-stretch:100%;font-variation-settings:"wdth" 100}
.chart{position:relative;background:var(--surface);border-radius:14px;padding:10px 0 6px}
.chart svg{display:block;width:100%;touch-action:pan-y}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .avg{fill:none;stroke:var(--olive);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.chart .end{fill:var(--olive);stroke:var(--surface);stroke-width:2}
.chart .endlab{fill:var(--ink);font-weight:650;font-size:12px}
.chart .bandr{fill:var(--band)}
.chart .target{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 3}
.chart .cross{stroke:var(--ink-2);stroke-width:1}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:2}
.tip b{font-weight:700;font-size:13px}
.tip .k{display:inline-block;width:12px;height:2px;background:var(--olive);vertical-align:middle;margin-right:6px}
.tip .k.d{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:10px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);padding:6px 14px 4px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.legend .ld{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.legend .ll{width:14px;height:2px;background:var(--olive)}
.empty{padding:26px 16px;text-align:center;font-size:14px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:var(--surface);border-radius:14px;padding:12px}
.tile span{display:block;font-size:12px;color:var(--ink-2);line-height:1.3}
.tile b{display:block;font-size:28px;line-height:1.1;font-weight:740;font-stretch:66%;font-variation-settings:"wdth" 66;margin:4px 0}
.list td,.list th{font-size:14px;padding:9px 0;border-top:1px solid var(--line);text-align:right;font-weight:440}
.list th{font-size:12px;color:var(--ink-3);border-top:0;font-weight:560}
.list td:first-child,.list th:first-child{text-align:left}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg button{height:40px;border-radius:9px;text-align:center;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
ol.guide{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2)}
ol.guide li{margin:7px 0}
ol.guide b,ol.guide code{color:var(--ink);font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--raised);padding:1px 5px;border-radius:5px}
details{background:var(--surface);border-radius:14px;padding:0 14px}
details summary{list-style:none;cursor:pointer;font-weight:600;padding:14px 0;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:20px;color:var(--ink-3);font-weight:440}
details[open] summary::after{content:"\2212"}
details .in{padding-bottom:14px}
.copy{display:flex;gap:6px;align-items:center;margin-top:5px}
.copy code{flex:1;padding:8px 10px;border-radius:9px}
.copy button{flex:none;height:36px;padding:0 12px;border-radius:9px;background:var(--raised);font-size:13px;font-weight:600}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 6px) max(10px,env(safe-area-inset-right));z-index:5}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg .acc{stroke:var(--olive)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.row:active{transform:none}}
</style>

/* Generic plan shape. Personal targets and dates live in the private data file, not here. */

  plan:{1:"strength",3:"run",4:"kb",6:"run"},

  strength:{name:"Strength",low:"strength",sub:"Full body, upper focus, about 35 min",letter:"S"},
  kb:{name:"KB EMOM",low:"KB EMOM",sub:"Kettlebell circuit, 20 to 25 min",letter:"K"}};
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var D1=["M","T","W","T","F","S","S"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------- tiny DOM helpers ---------- */

  if(attrs)for(k in attrs){if(attrs[k]==null)continue;if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}
  for(i=2;i<arguments.length;i++)add(e,arguments[i]);return e;}
function checkIcon(){return s("svg",{viewBox:"0 0 16 16","aria-hidden":"true"},s("path",{d:"M3 8.5l3.2 3.2L13 4.8",fill:"none",stroke:"currentColor","stroke-width":"2.4","stroke-linecap":"round","stroke-linejoin":"round"}));}

/* ---------- dates (all local) ---------- */
function pad(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(x){var p=x.split("-");return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(x,n){var d=parse(x);d.setDate(d.getDate()+n);return iso(d);}
function today(){return iso(new Date());}
function wd(x){return ((parse(x).getDay()+6)%7)+1;}
function monday(x){return addDays(x,1-wd(x));}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/864e5);}
function fmtDay(x){var d=parse(x);return DAYS[wd(x)-1]+" "+d.getDate()+" "+MONTHS[d.getMonth()];}
function fmtShort(x){var d=parse(x);return d.getDate()+" "+MON[d.getMonth()];}
function fmtRange(m){var a=parse(m),b=parse(addDays(m,6));
  return a.getMonth()===b.getMonth()?a.getDate()+"–"+b.getDate()+" "+MON[b.getMonth()]:a.getDate()+" "+MON[a.getMonth()]+" – "+b.getDate()+" "+MON[b.getMonth()];}
function isNum(v){return typeof v==="number"&&isFinite(v);}
function avg(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}

/* ---------- state ---------- */

function cfg(){

  o.targets=Object.assign({},DEF.targets,c.targets||{});

/* ---------- plan maths ---------- */
/* The plan start is personal, so it only exists once the private data file has loaded. Until then no week number is claimed. */

  var n=weekNo(m);return n<1?(n===0?"Warm-up week":"Before the plan"):"Week "+n;}

function setsDone(x){var d=day(x),t=setTargets(x);if(d.s&&d.s.strength)return true;return (d.pu||0)>=t.press&&(d.pl||0)>=t.pull;}
function healthOf(x){return S.data.health[x]||null;}
function checkinFor(m){

  for(i=6;i>=0;i--){x=addDays(m,i);c=S.data.checkins[x];if(c){best=Object.assign({date:x},c);break;}}
  if(!best||!isNum(best.wt)){for(i=6;i>=0;i--){x=addDays(m,i);hh=healthOf(x);
    if(hh&&isNum(hh.wt)){best=Object.assign({date:x},best||{},{wt:hh.wt,autoWt:true});if(!best.date)best.date=x;break;}}}
  return best;
}
function weekStats(m){
  var C=cfg(),t=today(),run=0,str=0,sets=0,prot=0,kcal=0,fib=0,sleep=[],steps=[],i,x,d,ss,hh;
  for(i=0;i<7;i++){x=addDays(m,i);d=S.data.days[x]||{};ss=d.s||{};
    if(ss.run)run++;if(ss.strength)str++;if(ss.kb)str++;if(setsDone(x))sets++;
    if(d.p)prot++;if(d.k)kcal++;if(d.f)fib++;
    hh=healthOf(x);if(hh){if(isNum(hh.sleep))sleep.push(hh.sleep);if(isNum(hh.steps)&&x<t)steps.push(hh.steps);}}
  var ci=checkinFor(m);

  var under=steps.length?steps.filter(function(v){return v<C.targets.stepsMin;}).length:(ci&&isNum(ci.under5k)?ci.under5k:null);
  var need={run:Math.max(0,C.floor.run-run),strength:Math.max(0,C.floor.strength-str),sets:Math.max(0,C.floor.sets-sets)};
  return {mon:m,run:run,str:str,sets:sets,prot:prot,kcal:kcal,fib:fib,sleepAvg:sleepAvg,sleepN:sleep.length,under:under,
    stepDays:steps.length||(under!=null?7:0),need:need,left:need.run+need.strength+need.sets,
    floor:!need.run&&!need.strength&&!need.sets,full:run>=C.full.run&&str>=C.full.strength&&sets>=C.full.sets,ci:ci};
}
function verdict(W){
  var t=today(),cur=monday(t)===W.mon,past=W.mon<monday(t),pre=planKnown()&&weekNo(W.mon)<1,needs=[];
  if(W.need.run)needs.push(plural(W.need.run,"run"));
  if(W.need.strength)needs.push(plural(W.need.strength,"strength session"));
  if(W.need.sets)needs.push(plural(W.need.sets,"set day"));
  if(W.full)return {h:"Full plan done",s:"Every planned session and set day is in."};
  if(W.floor)return {h:"Floor cleared",s:cur?"This week counts as on-plan. Anything more is a bonus.":"This week counted as on-plan."};
  /* Warm-up and earlier weeks: a cleared floor still counts, a missed one never counts against you */
  if(pre){if(past)return {h:"Not counted",s:"Practice before Week 1, so it doesn't count against you."};
    var w1=monday(cfg().rampStart);
    return {h:"Practice week",s:"Nothing counts until Week 1 starts "+(diffDays(w1,t)===1?"tomorrow":"on "+fmtDay(w1))+". Anything logged now is a head start."};}
  if(past)return {h:"Below the floor",s:"Short by "+joinList(needs)+"."};
  if(!cur)return {h:"Not started",s:"The floor is "+floorText()+"."};
  var left=8-wd(t);

}
function floorText(){var F=cfg().floor;return joinList([plural(F.run,"run"),plural(F.strength,"strength session"),"sets on "+plural(F.sets,"day")]);}
function maintenance(x){
  var C=cfg(),v=[],i,hh;if(!C.targets.maint)return null;
  for(i=0;i<7;i++){hh=healthOf(addDays(x,-i));if(hh&&isNum(hh.sleep))v.push(hh.sleep);}
  if(v.length>=4){var a=avg(v);return a<C.targets.sleepMin?{avg:a}:null;}
  var c=checkinFor(monday(x));if(!(c&&isNum(c.sleep)))c=checkinFor(addDays(monday(x),-7));
  return c&&isNum(c.sleep)&&c.sleep<C.targets.sleepMin?{avg:c.sleep}:null;
}
function firstWeek(){var ks=Object.keys(S.data.days).concat(Object.keys(S.data.checkins)).sort();
  var a=monday(cfg().rampStart),b=ks.length?monday(ks[0]):a;return a<b?a:b;}
function allWeeks(){var out=[],m=monday(today()),f=firstWeek();if(f>m)f=m;while(m>=f&&out.length<260){out.push(m);m=addDays(m,-7);}return out;}

function series(key){
  var out=[];allWeeks().reverse().forEach(function(m){var c=checkinFor(m);if(c&&isNum(c[key]))out.push({date:c.date,v:c[key]});});
  out.forEach(function(p,i){var v=[],j;for(j=0;j<=i;j++)if(diffDays(p.date,out[j].date)<28)v.push(out[j].v);p.avg=avg(v);p.n=v.length;});
  return out;
}
function latestMarker(key){
  var best=null;
  [S.data.markers,S.data.health].forEach(function(src){Object.keys(src).forEach(function(d){var v=src[d]&&src[d][key];
    if(isNum(v)&&(!best||d>best.date))best={date:d,v:v};});});

/* ---------- editing: every change is a small op, replayed on top of the remote copy ---------- */
function setPath(o,p,v){var t=o,i;for(i=0;i<p.length-1;i++){if(!t[p[i]]||typeof t[p[i]]!=="object")t[p[i]]={};t=t[p[i]];}
  if(v===null||v===undefined)delete t[p[p.length-1]];else t[p[p.length-1]]=v;}
function tidy(d){Object.keys(d.days).forEach(function(k){var x=d.days[k];
  if(x.s&&!Object.keys(x.s).length)delete x.s;if(!Object.keys(x).length)delete d.days[k];});}
function act(path,value,label){
  var v=value===undefined?null:value,last=S.queue[S.queue.length-1];
  setPath(S.data,path,v);S._cfg=null;
  if(!S.flushing&&last&&JSON.stringify(last.p)===JSON.stringify(path)){last.v=v;}
  else S.queue.push({p:path,v:v,l:label});
  saveLocal();render();schedule(1400);
}
function schedule(ms){if(!S.token){setSync();return;}setSync("busy","Saving");clearTimeout(S.timer);S.timer=setTimeout(sync,ms);}

/* ---------- GitHub storage ---------- */
function b64e(str){var b=new TextEncoder().encode(str),bin="",i;for(i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin);}

async function gh(method,path,body){
  var headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+S.token,"X-GitHub-Api-Version":"2022-11-28"},res,json=null;
  if(body)headers["Content-Type"]="application/json";
  try{res=await fetch(API+path,{method:method,cache:"no-store",headers:headers,body:body?JSON.stringify(body):undefined});}
  catch(e){var ne=new Error("network");ne.status=0;throw ne;}
  try{json=await res.json();}catch(e){}
  if(!res.ok){var err=new Error((json&&json.message)||("HTTP "+res.status));err.status=res.status;throw err;}
  return json;
}
async function pull(){
  var j=await gh("GET",SYNC.path+"?ref="+SYNC.branch),d;
  if(!j||typeof j.content!=="string")throw Object.assign(new Error("No data file"),{status:404});
  try{d=JSON.parse(b64d(j.content));}catch(e){throw Object.assign(new Error("data.json is not valid JSON"),{status:-1});}
  S.sha=j.sha;S.lastPull=Date.now();return normalize(d);
}
async function push(data,message){
  var j=await gh("PUT",SYNC.path,{message:message,content:b64e(JSON.stringify(data,null,1)+"\n"),sha:S.sha,branch:SYNC.branch});
  if(j&&j.content)S.sha=j.content.sha;
}
function errFor(e){
  var st=e&&e.status,m=String(e&&e.message||"");
  if(st===0)return "Couldn't reach GitHub. Check your connection and try again.";
  if(st===401)return "GitHub didn't accept that token. Check you copied all of it, or make a new one.";
  if(st===403&&/rate limit/i.test(m))return "GitHub's rate limit kicked in. Wait a few minutes and try again.";
  if(st===403)return "That token can't write to "+SYNC.repo+". It needs Contents: Read and write.";
  if(st===404)return "That token can't see "+SYNC.repo+". Under Repository access, pick Only select repositories, then "+SYNC.repo+".";
  return "GitHub said: "+m;

/* Apple Health arrives as small text files in inbox/, written by an iPhone Shortcut. */
function numFrom(x){
  var t=String(x==null?"":x).replace(/\s/g,""),m;
  if(t.indexOf(",")>=0&&t.indexOf(".")>=0)t=t.replace(/,/g,"");
  else if(/^-?\d{1,3}(,\d{3})+(\D|$)/.test(t))t=t.replace(/,/g,"");
  else t=t.replace(",",".");
  m=t.match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN;
}
function parseHealth(text,fileTime){
  var out={},nights={},lines=String(text||"").split(/\r?\n/),big=function(d,k,v){out[d]=out[d]||{};out[d][k]=v;};
  if(/^\s*\{/.test(text)){try{var j=JSON.parse(text),d0=String(j.date||"").slice(0,10);
    if(/^\d{4}-\d\d-\d\d$/.test(d0)){["sleep","steps","wt","bf","vo2","rhr"].forEach(function(k){var v=numFrom(j[k]);if(isFinite(v))big(d0,k,v);});}}catch(e){}
    return clean(out);}
  lines.forEach(function(line){
    var p=line.split("|").map(function(x){return x.trim();}),k=(p[0]||"").toUpperCase(),d,v,a,b,unit;
    if(k==="Z"){ if(!/core|deep|rem|asleep/i.test(p[1]||"")||/awake|in ?bed/i.test(p[1]||""))return;
      a=Date.parse(p[2]);b=Date.parse(p[3]);if(!isFinite(a)||!isFinite(b)||b<=a||b-a>16*36e5)return;
      d=iso(new Date(a+6*36e5));(nights[d]=nights[d]||[]).push([a,b]);return;}
    d=String(p[1]||"").slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(d))return;
    v=numFrom(p[2]);if(!isFinite(v))return;
    if(k==="S")big(d,"steps",Math.round((out[d]&&out[d].steps||0)+v));
    else if(k==="W"){unit=(p[3]||"").toLowerCase();
      if(/kg|kilo/.test(unit))v=v*2.20462;else if(/st/.test(unit))v=v*14;else if(!/lb|pound/.test(unit)&&v<140)v=v*2.20462;
      big(d,"wt",r1(v));}
    else if(k==="F")big(d,"bf",r1(v<=1?v*100:v));
    else if(k==="V")big(d,"vo2",r1(v));
    else if(k==="H")big(d,"rhr",Math.round(v));
  });
  /* total asleep per night = union of intervals, so two sources never double count */
  var keys=Object.keys(nights).sort();
  keys.forEach(function(d,idx){
    var start18=parse(addDays(d,-1));start18.setHours(18,0,0,0);
    if(fileTime&&start18.getTime()<fileTime-50*36e5)return;      /* night only partly inside the 2-day window */
    if(!fileTime&&keys.length>1&&idx===0)return;
    var iv=nights[d].sort(function(x,y){return x[0]-y[0];}),tot=0,cs=iv[0][0],ce=iv[0][1],i;
    for(i=1;i<iv.length;i++){if(iv[i][0]<=ce)ce=Math.max(ce,iv[i][1]);else{tot+=ce-cs;cs=iv[i][0];ce=iv[i][1];}}
    tot+=ce-cs;big(d,"sleep",Math.round(tot/36e3)/100);
  });
  return clean(out);
}
function clean(out){
  var lim={sleep:[0.5,16],steps:[0,100000],wt:[80,500],bf:[3,70],vo2:[10,90],rhr:[25,150]},d,k;
  for(d in out){for(k in out[d]){if(!lim[k]||!isNum(out[d][k])||out[d][k]<lim[k][0]||out[d][k]>lim[k][1])delete out[d][k];}
    if(!Object.keys(out[d]).length)delete out[d];}
  return out;
}
function mergeHealth(base,parsed){
  var changed=false,d,k,cur;
  for(d in parsed){cur=base.health[d]||{};
    for(k in parsed[d]){var v=parsed[d][k];
      if((k==="steps"||k==="sleep")&&isNum(cur[k])&&cur[k]>=v)continue;   /* totals only grow as a day completes */
      if(cur[k]!==v){cur[k]=v;changed=true;}}
    base.health[d]=cur;}
  return changed;
}
async function readInbox(){
  var list,out=[],files,i,j,m,ft;
  try{list=await gh("GET",SYNC.inbox+"?ref="+SYNC.branch);}catch(e){if(e.status===404)return out;throw e;}
  if(!Array.isArray(list))return out;
  files=list.filter(function(f){return f.type==="file"&&!/^\./.test(f.name)&&!/^readme/i.test(f.name);})
    .sort(function(a,b){return a.name<b.name?-1:1;}).slice(0,30);
  for(i=0;i<files.length;i++){
    m=files[i].name.match(/(\d{4})-(\d\d)-(\d\d)[-T_ ]?(\d\d)[:.]?(\d\d)/);
    ft=m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime():0;
    try{j=await gh("GET",files[i].path+"?ref="+SYNC.branch);out.push({path:files[i].path,sha:j.sha,parsed:parseHealth(b64d(j.content||""),ft)});}
    catch(e){if(e.status===0||e.status===401||e.status===403)throw e;out.push({path:files[i].path,sha:files[i].sha,parsed:{}});}
  }
  return out;
}
async function sync(){
  if(!S.token)return;
  if(S.flushing){S.again=true;return;}
  S.flushing=true;clearTimeout(S.timer);setSync("busy",S.queue.length?"Saving":"Checking");
  var ops=S.queue.slice(),inbox=[],base=null,wrote=false,attempt,healthChanged;
  try{
    S.remote=await pull();
    inbox=await readInbox();
    for(attempt=0;attempt<3;attempt++){
      base=clone(S.remote);healthChanged=false;
      inbox.forEach(function(f){if(mergeHealth(base,f.parsed))healthChanged=true;});
      if(inbox.length){base.meta.healthAt=new Date().toISOString();}
      ops.forEach(function(op){setPath(base,op.p,op.v);});tidy(base);
      if(!ops.length&&!inbox.length)break;
      try{await push(base,commitMsg(ops,inbox.length));S.remote=base;wrote=true;break;}
      catch(e){if((e.status===409||e.status===422)&&attempt<2){S.remote=await pull();continue;}throw e;}
    }
    S.queue=S.queue.slice(ops.length);
    var next=clone(S.remote);S.queue.forEach(function(op){setPath(next,op.p,op.v);});
    setData(next);saveLocal();
    setSync("ok","Saved");render();
    if(wrote)for(var i=0;i<inbox.length;i++){try{await gh("DELETE",inbox[i].path,{message:"Merged Apple Health file",sha:inbox[i].sha,branch:SYNC.branch});}catch(e){}}
  }catch(e){
    if(e.status===0)setSync("bad","Offline, saved on this device");
    else if(e.status===401){setSync("bad","Token expired");}
    else setSync("bad","Couldn't save");
    S.sync.detail=errFor(e);if(S.view==="setup")render();
  }finally{
    S.flushing=false;
    if(S.again||S.queue.length){S.again=false;if(S.queue.length&&S.sync.state!=="bad")schedule(800);}
  }
}
function commitMsg(ops,nInbox){
  var seen=[];ops.forEach(function(o){if(o.l&&seen.indexOf(o.l)<0)seen.push(o.l);});
  if(nInbox)seen.push("Apple Health");
  var m=seen.join(", ")||"Update";return m.length>72?m.slice(0,69)+"…":m;
}
function setSync(state,msg){
  if(state){S.sync.state=state;S.sync.msg=msg;S.sync.detail="";}
  else if(!S.token){S.sync.state="local";S.sync.msg="Not connected";}
  var el=document.getElementById("syncchip");
  if(el){el.className="sync "+S.sync.state;el.lastChild.textContent=S.sync.msg;}
}
